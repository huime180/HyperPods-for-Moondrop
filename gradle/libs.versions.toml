[versions]
agp = "9.1.0"
kotlin = "2.3.20"
coreKtx = "1.17.0"
androidx-activity-compose = "1.13.0"
composeBom = "2025.05.00"
kotlinxSerializationJson = "1.9.0"
# Miuix 从 0.5.1 的「聚合产物」改成 0.9.3 的「拆分产物」：只有拆分产物里才有
# basic.LazyColumn 之外的 preference.* / icon.* / overlay.OverlayDialog 等等。
miuix = "0.9.3"
navigation3 = "1.1.0-rc01"
junit = "4.13.2"
# HyperOS 焦点通知 / 超级岛的模板库（与 HyperPods 的 dev 分支同一个库、同一版本）：
# 手拼 miui.focus.* 的两袋 Parcelable 只能靠反汇编试错，这个库就是那套模板的实现。
focusApi = "1.4"

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }
agp-lib = { id = "com.android.library", version.ref = "agp" }
# 注意：AGP 9 自带 Kotlin 编译支持，不再 apply org.jetbrains.kotlin.android；
# 需要非默认 KGP 时由根 build.gradle.kts 的 buildscript classpath 提升版本（见该文件注释）。
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
coreKtx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
focus-api = { group = "com.xzakota.hyper.notification", name = "focus-api", version.ref = "focusApi" }
miuix = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix" }
# 背景动效（ui/effect）需要：RuntimeShader 笔刷 + 混合模式 + Backdrop 模糊
miuix-blur = { group = "top.yukonga.miuix.kmp", name = "miuix-blur-android", version.ref = "miuix" }
miuix-navigation3-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-navigation3-ui-android", version.ref = "miuix" }
navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
