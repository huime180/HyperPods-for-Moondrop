name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        # compileSdk 37 由 miuix 0.9.3 的 AAR metadata(minCompileSdk=37) 要求；
        # 失败也不阻塞（AGP 自身会在需要时自动下载缺失组件）。
        continue-on-error: true
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests (protocol core)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        continue-on-error: true

      - name: Collect artifacts
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/**

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiuixMoondrop-apk
          path: out/*.apk
          if-no-files-found: error
